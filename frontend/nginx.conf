server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The browser only talks to /api/*; nginx strips the prefix and forwards to the FastAPI container.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # /chat is a server-sent-events stream: never buffer or compress it, and allow long-running agent turns.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
  }

  # Hashed build assets can be cached forever; the HTML shell must always be revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
