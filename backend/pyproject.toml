[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv", ".pgdata"]

[tool.ruff.lint]
# Bug-finding rules, not style churn: syntax errors, pyflakes, bugbear, import order.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
  "B008",  # FastAPI's `Depends(...)` in argument defaults is the framework's documented pattern
  "E731",  # short `lambda` assignments in tests/CLI glue
  "E701", "E702",  # compact one-liners in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]  # `assert False`-style and broad pytest.raises are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]
