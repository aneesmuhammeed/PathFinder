name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL + pgvector, same image the Docker Compose setup uses.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pathfinder
          POSTGRES_PASSWORD: pathfinder
          POSTGRES_DB: pathfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathfinder -d pathfinder"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pathfinder:pathfinder@localhost:5432/pathfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        # Includes the eval-harness tests, which start their own embedded Postgres.
        run: pytest -q

  evals:
    name: Evals (regression check)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the free evals (mock LLM, embedded Postgres)
        run: python -m evals.run --out ../EVALS.generated.md
      - name: Fail if the report's selection rules disagree with the shipped defaults
        run: "! grep -q 'Selection rules disagree' ../EVALS.generated.md"
      - name: Fail if the agent regression suite regressed against the mock
        run: grep -q '17/17 scenarios passed' ../EVALS.generated.md
      - uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: EVALS.generated.md

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit shipped (runtime) dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: pathfinder-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: pathfinder-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the full stack with Docker Compose
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q "<title>Pathfinder</title>"
          # a real chat turn through nginx (proves the SSE proxy settings)
          uid=$(curl -fsS -X POST http://localhost:8080/api/users -H 'content-type: application/json' -d '{}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -fsSN -X POST http://localhost:8080/api/chat -H 'content-type: application/json' \
            -d "{\"user_id\":\"$uid\",\"message\":\"find me a backend internship\"}" | grep -q '^event: message'
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
